  frontend-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 60

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          yarn config set registry https://registry.npmjs.org
          for attempt in 1 2 3; do
            echo "Yarn install attempt ${attempt}/3"
            if yarn install --frozen-lockfile --network-timeout 600000; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Frozen lockfile install failed. Running non-frozen fallback for CI continuity..."
              yarn install --network-timeout 600000
              break
            fi
            echo "Transient fetch error detected. Cleaning cache and retrying..."
            yarn cache clean --all || true
            sleep 5
          done

      - name: Frontend build
        working-directory: frontend
        run: CI=true yarn build

      - name: Frontend performance smoke
        working-directory: frontend
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            export PERF_SMOKE_PROFILE=prod
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            export PERF_SMOKE_PROFILE=stage
          else
            export PERF_SMOKE_PROFILE=dev
          fi
          git show HEAD~1:frontend/perf-baseline/latest.json > build/perf-smoke-report.prev.json || true
          node scripts/ci_perf_smoke.js

      - name: Upload frontend perf smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-perf-smoke-report
          path: frontend/build/perf-smoke-report.json

      - name: Comment perf delta on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- perf-smoke-delta-comment -->';
            const reportPath = 'frontend/build/perf-smoke-report.json';
            if (!fs.existsSync(reportPath)) {
              core.setFailed('Perf smoke report not found');
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const profile = report.threshold_profile || 'dev';
            const js = report.metrics?.main_js?.gzip_kb;
            const css = report.metrics?.main_css?.gzip_kb;
            const jsMax = report.thresholds?.main_js_gzip_kb_max;
            const cssMax = report.thresholds?.main_css_gzip_kb_max;
            const deltaJs = report.delta_vs_previous?.main_js_gzip_kb_delta;
            const deltaCss = report.delta_vs_previous?.main_css_gzip_kb_delta;
            const deltaNote = report.delta_vs_previous?.note || report.delta_vs_previous?.error || '';
            const jsRatio = Number(report.threshold_utilization?.main_js_used_ratio || 0);
            const cssRatio = Number(report.threshold_utilization?.main_css_used_ratio || 0);
            const baselineAvgCount = Number(report.last_5_baseline_avg?.sample_count || 0);
            const baselineAvgJs = report.last_5_baseline_avg?.main_js_gzip_kb_avg;
            const baselineAvgCss = report.last_5_baseline_avg?.main_css_gzip_kb_avg;
            const deltaVsAvgJs = report.delta_vs_last_5_baseline_avg?.main_js_gzip_kb_delta;
            const deltaVsAvgCss = report.delta_vs_last_5_baseline_avg?.main_css_gzip_kb_delta;
            const deviationVsAvgJsPct = report.delta_vs_last_5_baseline_avg?.main_js_deviation_pct;
            const deviationVsAvgCssPct = report.delta_vs_last_5_baseline_avg?.main_css_deviation_pct;

            const proximityTag = (ratio) => {
              if (!Number.isFinite(ratio) || ratio <= 0) return '⚪ n/a';
              if (ratio > 1) return '🔴 over-limit';
              if (ratio > 0.9) return '🟡 near-limit';
              return '🟢 healthy';
            };

            const ratioLabel = (ratio) => {
              if (!Number.isFinite(ratio) || ratio <= 0) return 'n/a';
              return `${(ratio * 100).toFixed(1)}%`;
            };

            const trendArrow = (value) => {
              if (!Number.isFinite(Number(value))) return '→';
              const parsed = Number(value);
              if (parsed > 0) return '↑';
              if (parsed < 0) return '↓';
              return '→';
            };

            const toneBadge = (value) => {
              if (!Number.isFinite(Number(value))) return '⚪';
              const parsed = Number(value);
              if (parsed > 0) return '🔴';
              if (parsed < 0) return '🟢';
              return '🟡';
            };

            const deltaLabel = (value, unit = 'KB') => {
              if (!Number.isFinite(Number(value))) return 'n/a';
              const parsed = Number(value);
              const sign = parsed > 0 ? '+' : '';
              return `${toneBadge(parsed)} ${sign}${parsed.toFixed(2)} ${unit} ${trendArrow(parsed)}`;
            };

            const percentDeltaLabel = (value) => {
              if (!Number.isFinite(Number(value))) return 'n/a';
              const parsed = Number(value);
              const sign = parsed > 0 ? '+' : '';
              return `${toneBadge(parsed)} ${sign}${parsed.toFixed(2)}% ${trendArrow(parsed)}`;
            };

            const jsProximity = proximityTag(jsRatio);
            const cssProximity = proximityTag(cssRatio);

            const body = [
              marker,
              '### Frontend Perf Smoke Delta',
              `- Profile: **${profile}**`,
              `- Main JS (gzip): **${js} KB** / limit **${jsMax} KB** → ${jsProximity} (budget used: ${ratioLabel(jsRatio)})`,
              `- Main CSS (gzip): **${css} KB** / limit **${cssMax} KB** → ${cssProximity} (budget used: ${ratioLabel(cssRatio)})`,
              `- Δ JS vs previous: **${deltaLabel(deltaJs)}**`,
              `- Δ CSS vs previous: **${deltaLabel(deltaCss)}**`,
              `- Last ${baselineAvgCount || 0} baseline avg (JS/CSS gzip): **${baselineAvgJs ?? 'n/a'} KB / ${baselineAvgCss ?? 'n/a'} KB**`,
              `- Δ vs last-${baselineAvgCount || 0} avg (JS/CSS): **${deltaLabel(deltaVsAvgJs)} / ${deltaLabel(deltaVsAvgCss)}**`,
              `- Sapma vs last-${baselineAvgCount || 0} avg (%): **${percentDeltaLabel(deviationVsAvgJsPct)} / ${percentDeltaLabel(deviationVsAvgCssPct)}**`,
              `- Delta source note: ${deltaNote || 'ok'}`,
              `- Threshold result: JS=${report.threshold_result?.main_js_within_limit}, CSS=${report.threshold_result?.main_css_within_limit}`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

