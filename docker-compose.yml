services:
  postgres:
    image: postgres:16-alpine
    container_name: trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_platform
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trading_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://trader:trader@postgres:5432/trading_platform
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-this
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "720"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DEFAULT_ADMIN_EMAIL: admin@platform.local
      DEFAULT_ADMIN_PASSWORD: Admin12345!
    depends_on:
      - postgres
      - redis
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    command: >
      sh -c 'test -n "$REACT_APP_BACKEND_URL" || (echo "Missing REACT_APP_BACKEND_URL" >&2; exit 1);
      yarn start'
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
