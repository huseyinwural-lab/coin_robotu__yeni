name: prod-gate-check

on:
  workflow_dispatch:

jobs:
  prod-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make CI scripts executable
        run: chmod +x scripts/*.sh
      - name: Run alembic drift gate
        run: bash scripts/ci_alembic_drift_gate.sh
      - name: Run prod release gate
        run: bash scripts/ci_prod_gate.sh