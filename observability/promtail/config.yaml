server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: backend-supervisor
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend-supervisor
          service: backend-api
          __path__: /var/log/supervisor/backend*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            logger: logger
            request_id: request_id
            session_id: session_id
            event_type: event_type
            reason_code: reason_code
            user_id: user_id
            status_code: status_code
            path: path
            method: method
            duration_ms: duration_ms
      - labels:
          level:
          event_type:
          reason_code:
          method:
          status_code:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  - job_name: frontend-supervisor
    static_configs:
      - targets:
          - localhost
        labels:
          job: frontend-supervisor
          service: frontend-web
          __path__: /var/log/supervisor/frontend*.log
