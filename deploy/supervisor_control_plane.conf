; Identity + Risk + Trading Control Plane runtime config (versioned in repo)
; Purpose:
; - backend wait-for-db preflight
; - restart/retry policy
; - postgres process management
; - health/readiness contract uses /api/health and /api/ready

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/15/main -c config_file=/etc/postgresql/15/main/postgresql.conf
user=postgres
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=5
stderr_logfile=/var/log/supervisor/postgresql.err.log
stdout_logfile=/var/log/supervisor/postgresql.out.log
stderr_logfile_maxbytes=20MB
stdout_logfile_maxbytes=20MB
stderr_logfile_backups=5
stdout_logfile_backups=5

[program:backend]
command=/app/scripts/start_backend_with_db_guard.sh
directory=/app/backend
autostart=true
autorestart=true
startretries=10
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/backend.err.log
stdout_logfile=/var/log/supervisor/backend.out.log
stderr_logfile_maxbytes=20MB
stdout_logfile_maxbytes=20MB
stderr_logfile_backups=5
stdout_logfile_backups=5
