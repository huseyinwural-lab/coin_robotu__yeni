name: Deploy Gate

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  backend-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint (backend)
        run: |
          pip install ruff
          ruff check backend --select E9,F63,F7,F82,F401,E402 --exclude backend/tests,backend/cli
          ruff check backend/tests backend/cli --select E402,F401

      - name: Block embedded DB references
        working-directory: backend
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          if grep -R "sqlite" .; then
            echo "SQLite forbidden"
            exit 1
          fi

      - name: Pytest smoke gate
        working-directory: backend
        run: |
          pytest -q tests/test_iteration165_prod_gate_smoke.py

  frontend-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Frontend build
        working-directory: frontend
        run: yarn build
