name: FAZ-5 Runtime Auth Smoke

on:
  workflow_dispatch:

jobs:
  runtime-auth-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trading_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trader -d trading_platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+psycopg2://trader:trader@localhost:5432/trading_platform
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET }}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 720
      EXCHANGE_CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.EXCHANGE_CREDENTIALS_ENCRYPTION_KEY || vars.EXCHANGE_CREDENTIALS_ENCRYPTION_KEY }}
      CORS_ORIGINS: http://localhost:3000
      ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL || vars.ADMIN_BOOTSTRAP_EMAIL }}
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD || vars.ADMIN_BOOTSTRAP_PASSWORD }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL || vars.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || vars.TEST_ADMIN_PASSWORD }}
      BACKEND_URL: http://localhost:8001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install psycopg2-binary sqlalchemy alembic

      - name: Run FAZ-5 runtime auth smoke
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/verify_runtime_auth_smoke.sh
          ./scripts/verify_runtime_auth_smoke.sh 2>&1 | tee /tmp/faz5_runtime_auth.log

      - name: Upload FAZ-5 logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: faz5-runtime-auth-smoke-log
          path: |
            /tmp/faz5_runtime_auth.log
            /tmp/faz5_backend.log
            /tmp/faz5_login_body.json
            /tmp/faz5_admin_body.json
