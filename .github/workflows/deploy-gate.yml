      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run Phase0 determinism verifier
        run: bash scripts/verify_phase0_db_determinism.sh

      - name: Upload Phase0 verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-db-determinism-artifacts
          path: |
            artifacts/faz0_verify_phase0_db_determinism.log
            artifacts/faz0_embeddeddb_scan_post_cleanup.log
            artifacts/faz0_embeddeddb_scan_filtered.log
            artifacts/faz0_forbidden_file_patterns.log
            artifacts/faz0_env_config_validation.log
            artifacts/faz0_runtime_guard_presence.log
            artifacts/faz0_test_bootstrap_guard.log
            artifacts/faz0_alembic_upgrade.log
            artifacts/faz0_alembic_current.log
            artifacts/faz0_alembic_heads.log
            artifacts/faz0_persistence_db_smoke.log
            artifacts/faz0_persistence_restart.log

