name: Deploy Gate

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  backend-quality-gate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://trader:trader@localhost:5432/trading_platform
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-jwt-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 720
      CORS_ORIGINS: http://localhost:3000
      DEFAULT_ADMIN_EMAIL: admin@platform.local
      DEFAULT_ADMIN_PASSWORD: Admin12345!
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trading_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trader -d trading_platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint (backend)
        run: |
          pip install ruff
          ruff check backend --select E9,F63,F7,F82,F401,E402 --exclude backend/tests,backend/cli
          ruff check backend/tests backend/cli --select E402,F401

      - name: Block embedded DB references
        working-directory: backend
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          if grep -R "sqlite" .; then
            echo "SQLite forbidden"
            exit 1
          fi

      - name: Pytest smoke gate
        working-directory: backend
        run: |
          alembic upgrade head
          pytest -q tests/test_iteration165_prod_gate_smoke.py

      - name: Pytest contract gate
        working-directory: backend
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            export LATENCY_BUDGET_PROFILE=prod
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            export LATENCY_BUDGET_PROFILE=stage
          else
            export LATENCY_BUDGET_PROFILE=dev
          fi
          pytest -q tests/test_execution_readiness_contract.py tests/test_release_gate_contract.py tests/test_api_latency_budget_contract.py

  frontend-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Frontend build
        working-directory: frontend
        run: yarn build

      - name: Frontend performance smoke
        working-directory: frontend
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            export PERF_SMOKE_PROFILE=prod
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            export PERF_SMOKE_PROFILE=stage
          else
            export PERF_SMOKE_PROFILE=dev
          fi
          git show HEAD~1:frontend/perf-baseline/latest.json > build/perf-smoke-report.prev.json || true
          node scripts/ci_perf_smoke.js

      - name: Upload frontend perf smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-perf-smoke-report
          path: frontend/build/perf-smoke-report.json

      - name: Comment perf delta on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- perf-smoke-delta-comment -->';
            const reportPath = 'frontend/build/perf-smoke-report.json';
            if (!fs.existsSync(reportPath)) {
              core.setFailed('Perf smoke report not found');
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const profile = report.threshold_profile || 'dev';
            const js = report.metrics?.main_js?.gzip_kb;
            const css = report.metrics?.main_css?.gzip_kb;
            const jsMax = report.thresholds?.main_js_gzip_kb_max;
            const cssMax = report.thresholds?.main_css_gzip_kb_max;
            const deltaJs = report.delta_vs_previous?.main_js_gzip_kb_delta;
            const deltaCss = report.delta_vs_previous?.main_css_gzip_kb_delta;
            const deltaNote = report.delta_vs_previous?.note || report.delta_vs_previous?.error || '';
            const jsRatio = Number(report.threshold_utilization?.main_js_used_ratio || 0);
            const cssRatio = Number(report.threshold_utilization?.main_css_used_ratio || 0);

            const proximityTag = (ratio) => {
              if (!Number.isFinite(ratio) || ratio <= 0) return '⚪ n/a';
              if (ratio > 1) return '🔴 over-limit';
              if (ratio >= 0.9) return '🟡 near-limit';
              return '🟢 healthy';
            };

            const jsProximity = proximityTag(jsRatio);
            const cssProximity = proximityTag(cssRatio);

            const body = [
              marker,
              '### Frontend Perf Smoke Delta',
              `- Profile: **${profile}**`,
              `- Main JS (gzip): **${js} KB** / limit **${jsMax} KB** → ${jsProximity}`,
              `- Main CSS (gzip): **${css} KB** / limit **${cssMax} KB** → ${cssProximity}`,
              `- Δ JS vs previous: **${deltaJs ?? 'n/a'} KB**`,
              `- Δ CSS vs previous: **${deltaCss ?? 'n/a'} KB**`,
              `- Delta source note: ${deltaNote || 'ok'}`,
              `- Threshold result: JS=${report.threshold_result?.main_js_within_limit}, CSS=${report.threshold_result?.main_css_within_limit}`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
