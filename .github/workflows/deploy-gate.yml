name: Deploy Gate

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  secret-leak-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI security env fallback
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import base64
          import os
          import secrets

          def emit(key: str, value: str) -> None:
              print(f"{key}={value}")

          jwt_secret = os.getenv("JWT_SECRET") or secrets.token_urlsafe(48)
          if len(jwt_secret) < 32:
              jwt_secret = jwt_secret + secrets.token_urlsafe(32)

          exchange_key = os.getenv("EXCHANGE_CREDENTIALS_ENCRYPTION_KEY")
          if not exchange_key:
              exchange_key = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()

          admin_bootstrap_email = os.getenv("ADMIN_BOOTSTRAP_EMAIL") or f"ci-admin-{os.getenv('GITHUB_RUN_ID', '0')}@example.local"
          admin_bootstrap_password = os.getenv("ADMIN_BOOTSTRAP_PASSWORD") or secrets.token_urlsafe(24)
          test_admin_email = os.getenv("TEST_ADMIN_EMAIL") or admin_bootstrap_email
          test_admin_password = os.getenv("TEST_ADMIN_PASSWORD") or admin_bootstrap_password

          emit("JWT_SECRET", jwt_secret)
          emit("EXCHANGE_CREDENTIALS_ENCRYPTION_KEY", exchange_key)
          emit("ADMIN_BOOTSTRAP_EMAIL", admin_bootstrap_email)
          emit("ADMIN_BOOTSTRAP_PASSWORD", admin_bootstrap_password)
          emit("TEST_ADMIN_EMAIL", test_admin_email)
          emit("TEST_ADMIN_PASSWORD", test_admin_password)
          PY

      - name: Run secret leak guard
        run: bash scripts/ci_secret_leak_guard.sh

      - name: Upload secret scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faz6-secret-scan-artifacts
          path: |
            artifacts/faz6_secret_scan_report.log
            artifacts/faz6_secret_scan_report.json

  backend-quality-gate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://trader:trader@localhost:5432/trading_platform
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET || 'phase8-ci-jwt-secret-ultra-strong-2026-03-20-abcdef' }}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 720
      EXCHANGE_CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.EXCHANGE_CREDENTIALS_ENCRYPTION_KEY || vars.EXCHANGE_CREDENTIALS_ENCRYPTION_KEY || 'phase8-ci-exchange-key-32-bytes-minimum-20260320' }}
      CORS_ORIGINS: http://localhost:3000
      ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL || vars.ADMIN_BOOTSTRAP_EMAIL || 'canary.admin@platform.local' }}
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD || vars.ADMIN_BOOTSTRAP_PASSWORD || 'CanaryAdmin123!' }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL || vars.TEST_ADMIN_EMAIL || 'canary.admin@platform.local' }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD || vars.TEST_ADMIN_PASSWORD || 'CanaryAdmin123!' }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trading_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trader -d trading_platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI security env fallback
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import base64
          import os
          import secrets

          def emit(key: str, value: str) -> None:
              print(f"{key}={value}")

          jwt_secret = os.getenv("JWT_SECRET") or secrets.token_urlsafe(48)
          if len(jwt_secret) < 32:
              jwt_secret = jwt_secret + secrets.token_urlsafe(32)

          exchange_key = os.getenv("EXCHANGE_CREDENTIALS_ENCRYPTION_KEY")
          if not exchange_key:
              exchange_key = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()

          admin_bootstrap_email = os.getenv("ADMIN_BOOTSTRAP_EMAIL") or f"ci-admin-{os.getenv('GITHUB_RUN_ID', '0')}@example.local"
          admin_bootstrap_password = os.getenv("ADMIN_BOOTSTRAP_PASSWORD") or secrets.token_urlsafe(24)
          test_admin_email = os.getenv("TEST_ADMIN_EMAIL") or admin_bootstrap_email
          test_admin_password = os.getenv("TEST_ADMIN_PASSWORD") or admin_bootstrap_password

          emit("JWT_SECRET", jwt_secret)
          emit("EXCHANGE_CREDENTIALS_ENCRYPTION_KEY", exchange_key)
          emit("ADMIN_BOOTSTRAP_EMAIL", admin_bootstrap_email)
          emit("ADMIN_BOOTSTRAP_PASSWORD", admin_bootstrap_password)
          emit("TEST_ADMIN_EMAIL", test_admin_email)
          emit("TEST_ADMIN_PASSWORD", test_admin_password)
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint (backend)
        run: |
          pip install ruff
          ruff check backend --select E9,F63,F7,F82,F401,E402 --exclude backend/tests,backend/cli
          ruff check backend/tests backend/cli --select E402,F401

      - name: Pytest smoke gate
        working-directory: backend
        run: |
          alembic upgrade head
          pytest -q tests/test_iteration165_prod_gate_smoke.py

      - name: Pytest contract gate
        working-directory: backend
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            export LATENCY_BUDGET_PROFILE=prod
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            export LATENCY_BUDGET_PROFILE=stage
          else
            export LATENCY_BUDGET_PROFILE=dev
          fi
          pytest -q tests/test_execution_readiness_contract.py tests/test_release_gate_contract.py tests/test_api_latency_budget_contract.py

