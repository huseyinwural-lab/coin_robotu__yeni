name: FAZ-4 Clean Install Proof

on:
  workflow_dispatch:

jobs:
  verify-clean-install:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trading_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trader -d trading_platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg2://trader:trader@localhost:5432/trading_platform
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 720
      CORS_ORIGINS: http://localhost:3000
      DEFAULT_ADMIN_EMAIL: admin@platform.local
      DEFAULT_ADMIN_PASSWORD: Admin12345!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install psycopg2-binary sqlalchemy alembic pyyaml

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import psycopg2
          for i in range(60):
              try:
                  conn = psycopg2.connect(
                      host="localhost",
                      port=5432,
                      user="trader",
                      password="trader",
                      dbname="trading_platform",
                  )
                  conn.close()
                  print("PostgreSQL is ready")
                  break
              except Exception:
                  if i == 59:
                      raise
                  time.sleep(2)
          PY

      - name: Run clean install verification
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/verify_clean_install.sh
          ./scripts/verify_clean_install.sh 2>&1 | tee /tmp/faz4_proof.log

      - name: Print proof summary
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          grep -E "\[SUCCESS\]|\[OK\] alembic_version" /tmp/faz4_proof.log || true
          python - <<'PY'
          from sqlalchemy import create_engine, text, inspect
          import os

          u = os.environ["DATABASE_URL"]
          e = create_engine(u)
          with e.connect() as c:
              print("alembic_version=", c.execute(text("select version_num from alembic_version")).scalar())

          ins = inspect(e)
          crit = [
              "users",
              "bot_profiles",
              "risk_policies",
              "pending_signals",
              "admin_control",
              "audit_logs",
              "signal_events",
              "paper_positions",
          ]
          tables = set(ins.get_table_names())
          print("critical_missing=", sorted(set(crit) - tables))

          found = False
          for fk in ins.get_foreign_keys("pending_signals"):
              if (
                  fk.get("constrained_columns") == ["risk_policy_id"]
                  and fk.get("referred_table") == "risk_policies"
                  and fk.get("referred_columns") == ["id"]
              ):
                  found = True
                  print("fk_risk_policy=OK")
          if not found:
              raise SystemExit("fk_risk_policy=FAIL")
          PY

      - name: Upload proof log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: faz4-migration-proof
          path: /tmp/faz4_proof.log