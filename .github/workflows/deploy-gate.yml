  backup-restore-s3-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://trader:trader@localhost:5432/trading_platform
      BACKUP_KEEP_COUNT: 7
      BACKUP_S3_UPLOAD_REQUIRED: 1
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET || vars.BACKUP_S3_BUCKET }}
      BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID || vars.BACKUP_AWS_ACCESS_KEY_ID }}
      BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY || vars.BACKUP_AWS_SECRET_ACCESS_KEY }}
      BACKUP_AWS_REGION: ${{ secrets.BACKUP_AWS_REGION || vars.BACKUP_AWS_REGION }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trading_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trader -d trading_platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate required security env
        run: |
          required_vars=(JWT_SECRET EXCHANGE_CREDENTIALS_ENCRYPTION_KEY ADMIN_BOOTSTRAP_EMAIL ADMIN_BOOTSTRAP_PASSWORD TEST_ADMIN_EMAIL TEST_ADMIN_PASSWORD)
          for key in "${required_vars[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required secret/env/var: $key"
              exit 1
            fi
          done

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate required S3 secrets
        run: |
          required_vars=(BACKUP_S3_BUCKET BACKUP_AWS_ACCESS_KEY_ID BACKUP_AWS_SECRET_ACCESS_KEY BACKUP_AWS_REGION)
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          for key in "${required_vars[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required secret/env/var: $key"
              exit 1
            fi
          done

      - name: Backup service unit test
        working-directory: backend
        run: pytest -q tests/test_s3_backup_service.py

      - name: Backup + restore + S3 smoke
        run: bash scripts/db_backup_restore_full_cycle_test.sh

      - name: Upload backup smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-restore-s3-artifacts
          path: |
            artifacts/backup.log
            artifacts/restore.log
            artifacts/db_backup_restore_test.log
            backups/*.sql

  frontend-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Frontend build
        working-directory: frontend
        run: yarn build

      - name: Frontend performance smoke
        working-directory: frontend
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            export PERF_SMOKE_PROFILE=prod
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            export PERF_SMOKE_PROFILE=stage
          else
            export PERF_SMOKE_PROFILE=dev
          fi
          git show HEAD~1:frontend/perf-baseline/latest.json > build/perf-smoke-report.prev.json || true
          node scripts/ci_perf_smoke.js

      - name: Upload frontend perf smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-perf-smoke-report
          path: frontend/build/perf-smoke-report.json

      - name: Comment perf delta on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- perf-smoke-delta-comment -->';
            const reportPath = 'frontend/build/perf-smoke-report.json';
            if (!fs.existsSync(reportPath)) {
              core.setFailed('Perf smoke report not found');
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const profile = report.threshold_profile || 'dev';
            const js = report.metrics?.main_js?.gzip_kb;
            const css = report.metrics?.main_css?.gzip_kb;
            const jsMax = report.thresholds?.main_js_gzip_kb_max;
            const cssMax = report.thresholds?.main_css_gzip_kb_max;
            const deltaJs = report.delta_vs_previous?.main_js_gzip_kb_delta;
            const deltaCss = report.delta_vs_previous?.main_css_gzip_kb_delta;
            const deltaNote = report.delta_vs_previous?.note || report.delta_vs_previous?.error || '';
            const jsRatio = Number(report.threshold_utilization?.main_js_used_ratio || 0);
            const cssRatio = Number(report.threshold_utilization?.main_css_used_ratio || 0);

            const proximityTag = (ratio) => {
              if (!Number.isFinite(ratio) || ratio <= 0) return '⚪ n/a';
              if (ratio > 1) return '🔴 over-limit';
              if (ratio >= 0.9) return '🟡 near-limit';
              return '🟢 healthy';
            };

            const jsProximity = proximityTag(jsRatio);
            const cssProximity = proximityTag(cssRatio);

            const body = [
              marker,
              '### Frontend Perf Smoke Delta',
              `- Profile: **${profile}**`,
              `- Main JS (gzip): **${js} KB** / limit **${jsMax} KB** → ${jsProximity}`,
              `- Main CSS (gzip): **${css} KB** / limit **${cssMax} KB** → ${cssProximity}`,
              `- Δ JS vs previous: **${deltaJs ?? 'n/a'} KB**`,
              `- Δ CSS vs previous: **${deltaCss ?? 'n/a'} KB**`,
              `- Delta source note: ${deltaNote || 'ok'}`,
              `- Threshold result: JS=${report.threshold_result?.main_js_within_limit}, CSS=${report.threshold_result?.main_css_within_limit}`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
